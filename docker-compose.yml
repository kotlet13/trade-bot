services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8081:3000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      DATA_DIR: /data
      WATCHLIST: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
      STARTING_CASH: "10000"
      PAPER_FEE_BPS: "10"
      DEFAULT_INTERVAL: 1m
    volumes:
      - ./data:/data
