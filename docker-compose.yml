services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8081:3000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      DATA_DIR: /data
      WATCHLIST: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,TONUSDT,ZECUSDT,TRXUSDT,SUIUSDT,ADAUSDT,AAVEUSDT,LINKUSDT,AXSUSDT,AVAXUSDT,LTCUSDT,APTUSDT,NEARUSDT,LDOUSDT,XLMUSDT,HBARUSDT,ARBUSDT,UNIUSDT,INJUSDT,DOTUSDT,BCHUSDT
      STARTING_CASH: "10000"
      PAPER_FEE_BPS: "10"
      DEFAULT_INTERVAL: 1m
      AUTO_PAPER_TRADING: "false"
      AUTO_PAPER_INTERVAL_SECONDS: "60"
      AUTO_PAPER_MAX_OPEN_SLOTS: "1"
      AUTO_PAPER_ALLOW_MULTI_STRATEGY_SAME_SIGNAL: "false"
      AUTO_PAPER_MAX_DAILY_ENTRIES: "3"
      AUTO_PAPER_MAX_DAILY_LOSS_PERCENT: "2"
      RUNTIME_TELEMETRY_ENABLED: "true"
      RUNTIME_TELEMETRY_INTERVAL_SECONDS: "900"
      RUNTIME_TELEMETRY_CANDLE_LIMIT: "240"
      RUNTIME_TELEMETRY_FUTURES_ENABLED: "true"
      RUNTIME_TELEMETRY_SIGNAL_EVALUATIONS: "true"
    volumes:
      - ./data:/data
  news-events:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
      - app
    working_dir: /app
    command: python scripts/news_event_service.py
    environment:
      NEWS_EVENT_INTERVAL_SECONDS: "900"
      NEWS_EVENT_COLLECTOR_LIMIT_PER_SOURCE: "50"
      NEWS_EVENT_IMPACT_SINCE_HOURS: "168"
      NEWS_EVENT_MARKET_MEMORY_SINCE_HOURS: "168"
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./tmp:/app/tmp
